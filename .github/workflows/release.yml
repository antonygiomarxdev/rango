name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Validate before releasing
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------------
  # Build binaries for all target platforms
  # ---------------------------------------------------------------------------
  build:
    name: Build / ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rango-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: rango-linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rango-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rango-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rango-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for ARM Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --package rango --target ${{ matrix.target }}

      - name: Build CLI (cross)
        if: matrix.cross
        run: cross build --release --package rango --target ${{ matrix.target }}

      - name: Build Server (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --package rango-server --target ${{ matrix.target }}

      - name: Build Server (cross)
        if: matrix.cross
        run: cross build --release --package rango-server --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rango dist/
          cp target/${{ matrix.target }}/release/rango-server dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rango.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/rango-server.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          awk '/^## \['"${{ steps.version.outputs.VERSION }}"'\]/,/^## \[/' CHANGELOG.md \
            | sed '$d' > release_notes.md
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Rango v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*

  # ---------------------------------------------------------------------------
  # Publish to crates.io
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publish in dependency order
      - run: cargo publish --package rango-types --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20  # crates.io index propagation
      - run: cargo publish --package rango-storage --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-index --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-query --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-oplog --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-sync --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-server --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango-sdk --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 20
      - run: cargo publish --package rango --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
