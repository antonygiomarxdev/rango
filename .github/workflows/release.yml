name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Validate before releasing
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------------
  # Build binaries for all target platforms
  # ---------------------------------------------------------------------------
  build:
    name: Build / ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rango-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: rango-linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rango-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rango-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rango-windows-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for ARM Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --package rango-cli --target ${{ matrix.target }}

      - name: Build CLI (cross)
        if: matrix.cross
        run: cross build --release --package rango-cli --target ${{ matrix.target }}

      - name: Build Server (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --package rango-server --target ${{ matrix.target }}

      - name: Build Server (cross)
        if: matrix.cross
        run: cross build --release --package rango-server --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rango dist/
          cp target/${{ matrix.target }}/release/rango-server dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item "target/${{ matrix.target }}/release/rango.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/rango-server.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "release_name=Rango v${VERSION}" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "notes_mode=versioned" >> $GITHUB_OUTPUT
            echo "channel_tags=latest" >> $GITHUB_OUTPUT
          else
            VERSION="$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
            if [[ -z "${VERSION}" ]]; then
              VERSION="0.0.0"
            fi
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            TS="$(date -u +%Y%m%d-%H%M)"
            echo "release_name=Rango v${VERSION}-rango.${TS}+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "release_tag=v${VERSION}-rango-${TS}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "notes_mode=prerelease" >> $GITHUB_OUTPUT
            echo "channel_tags=nightly,beta" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [[ "${{ steps.meta.outputs.notes_mode }}" == "versioned" ]]; then
            VERSION="${{ steps.meta.outputs.version }}"
            if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              awk '/^## \['"$VERSION"'\]/,/^## \[/' CHANGELOG.md | sed '$d' > release_notes.md
            elif grep -q "^## \[Unreleased\]" CHANGELOG.md; then
              awk '/^## \[Unreleased\]/,/^## \[/' CHANGELOG.md | sed '$d' > release_notes.md
            else
              cat > release_notes.md <<EOF
          Release v$VERSION
          
          Binary artifacts:
          - rango (CLI)
          - rango-server (sync hub)
          EOF
            fi
          elif grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            awk '/^## \[Unreleased\]/,/^## \[/' CHANGELOG.md | sed '$d' > release_notes.md
          else
            VERSION="${{ steps.meta.outputs.version }}"
            cat > release_notes.md <<EOF
          Prerelease for v$VERSION from main
          
          Binary artifacts:
          - rango (CLI)
          - rango-server (sync hub)
          EOF
          fi
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.meta.outputs.release_name }}"
          tag_name: "${{ steps.meta.outputs.release_tag }}"
          target_commitish: "${{ github.sha }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: artifacts/**/*

      - name: Update channel tags
        run: |
          IFS=',' read -ra CHANNELS <<< "${{ steps.meta.outputs.channel_tags }}"
          for channel in "${CHANNELS[@]}"; do
            if [[ -n "${channel}" ]]; then
              git push --force origin "${GITHUB_SHA}:refs/tags/${channel}"
            fi
          done
